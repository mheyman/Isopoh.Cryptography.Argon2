name: CMake + .NET Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  linux:
    name: Linux — CMake + .NET (${{ matrix.dotnet-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ "6.0.x", "9.0.x" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Configure & build Reference (CMake, Release)
        working-directory: Reference
        run: |
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -- -j$(nproc)
          BIN=bin/Release/argon2
          if [ -f "$BIN" ]; then
            echo "REFERENCE_RUN_PATH=$(pwd)/$BIN" >> $GITHUB_ENV
            chmod +x "$BIN"
          else
            echo "Reference native binary not found at $BIN"
            ls -la
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-${{ matrix.dotnet-version }}
          path: '**/*.trx'

  windows:
    name: Windows — CMake + .NET
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Configure & build Reference (CMake + Visual Studio)
        shell: powershell
        working-directory: Reference
        run: |
          Write-Host "Configuring CMake (Visual Studio generator, x64)..."
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -- /m
          $out = Join-Path (Resolve-Path .).Path "bin\Release\argon2.exe"
          if (-not (Test-Path $out)) {
            Write-Host "Built files:"
            Get-ChildItem -Recurse -Force
            throw "Reference binary not found at bin\\Release\\argon2.exe"
          }
          Write-Host "Native Reference built: $out"
          Add-Content -Path $env:GITHUB_ENV -Value ("REFERENCE_RUN_PATH=" + $out)

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: '**/*.trx'