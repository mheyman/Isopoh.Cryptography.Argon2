name: Acquire Unity Activation File (legacy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # GameCI and Unity now consider Personal manual activation deprecated.
      # This remains an opt-in helper while the legacy endpoint is available.
      - name: Request manual activation file
        uses: game-ci/unity-request-activation-file@v2
        id: activation

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
